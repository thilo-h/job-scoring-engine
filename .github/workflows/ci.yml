name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # No ANTHROPIC_API_KEY is set, and conftest.py blocks socket connections,
      # so the suite has to pass entirely offline against fixtures/llm/.
      - name: Test
        run: pytest --cov=src --cov-report=term
